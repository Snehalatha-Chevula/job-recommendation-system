# Render Blueprint - single web service.
#
# Express serves both the API and the built React bundle, so the deployment has
# one public URL and needs no CORS configuration.
#
# The three CognoDB variables are marked `sync: false`, which means Render
# prompts for them in the dashboard and stores them as secrets. They are never
# written to this file or committed to the repository.

services:
  - type: web
    name: developer-skill-job-graph
    runtime: node
    plan: free
    buildCommand: npm install && npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20'
      # Set these in the Render dashboard - never in source control.
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USERNAME
        sync: false
      - key: COGNODB_PASSWORD
        sync: false
